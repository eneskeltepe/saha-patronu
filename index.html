<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1b2d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Saha Patronu</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hud-row">
      <div class="chip money" id="hud-money-chip"><span class="ico gold"></span><b id="hud-money">0₺</b></div>
      <div class="chip gems"><span class="ico gem"></span><b id="hud-gems">0</b></div>
      <div class="chip clock"><span id="hud-weather" class="ico"></span><div><b id="hud-time">Pazartesi 09:00</b><small id="hud-boost"></small></div></div>
      <button class="icon-btn" id="btn-settings" aria-label="Ayarlar"></button>
    </div>
    <div class="hud-row second">
      <div class="level"><span class="lv-badge" id="hud-level">1</span><div class="lv-bar"><i id="hud-xp"></i></div><small id="hud-rate" style="color:#9ec9a8"></small><small id="hud-xptxt"></small></div>
      <div id="venue-switch" class="venue-switch"></div>
    </div>
  </header>
  <main id="stage"><canvas id="game"></canvas><div id="toasts"></div></main>
  <section id="sheet" hidden><div id="sheet-title"></div><div id="sheet-body"></div></section>
  <nav id="tabs"></nav>
</div>
<div id="modal-root"></div>
<div id="splash"><div class="splash-in">
  <svg viewBox="0 0 120 120" class="splash-ball"><circle cx="60" cy="60" r="54" fill="#fff" stroke="#0f1b2d" stroke-width="4"/><path d="m60 34 22 16-8 26H46l-8-26zM60 34V8m22 42 26-8m-34 34 14 28M46 76 32 104M38 50 12 42" stroke="#0f1b2d" stroke-width="4" fill="#0f1b2d" stroke-linejoin="round"/></svg>
  <h1>Saha<span>Patronu</span></h1><p>Halı saha imparatorluğunu kur</p><div class="splash-bar"><i></i></div>
</div></div>
<noscript>Bu oyun JavaScript gerektirir.</noscript>
<script type="module" src="./src/main.js"></script>
</body>
</html>
